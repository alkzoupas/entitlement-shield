# EntitlementShield — unit costs for operational metrics.
#
# STUB (Phase 1 Step 0). Consumed by the evaluation harness (Step 7,
# docs/evaluation.md §8: "cost per prevented abuse credit", queue/latency costs).
# Values are illustrative placeholders for a synthetic world; tune when the
# operations metrics are wired up.

credits:
  free_credit_value_usd: 0.50      # notional cost of one wrongly-granted free credit
  wrongful_restriction_cost_usd: 5.00  # notional cost of one wrongly-restricted legitimate cluster-cycle

review:
  human_review_minutes: 8          # analyst time per queued case
  analyst_cost_per_hour_usd: 60.0

llm:                                # Phase 3 reviewer (decisions.md §12 L-8's carve-out)
  # Illustrative placeholders, in the same spirit as the `credits:`/`review:` blocks
  # above — NOT a quote for any specific model. The only provider in this repo is
  # `fake_reviewer.FakeReviewerProvider`, which costs nothing to run (L-7: no
  # network-capable dependency in Phase 3).
  #
  # NOTHING READS THIS BLOCK YET. It is not wired into any cost report, the
  # evaluation harness, or `scripts/arm4_run.py`'s artifact; the zeros it replaces
  # were placeholders too. It exists so the reviewer's unit costs have one declared
  # home before the operational-cost metrics are built, rather than being invented
  # inline at that point.
  cost_per_1k_input_tokens_usd: 0.003
  cost_per_1k_output_tokens_usd: 0.015
