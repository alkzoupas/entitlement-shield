{% extends "base.html" %}
{% block title %}Cases — EntitlementShield{% endblock %}
{% block content %}
<h1>Case queue</h1>
<div class="panel">
  <form class="filters"
        hx-get="/cases-table" hx-target="#cases-table" hx-swap="outerHTML"
        hx-trigger="change, submit">
    <div>
      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="">any</option>
        {% for s in statuses %}
        <option value="{{ s }}" {% if filters.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="action">Action</label>
      <select id="action" name="action">
        <option value="">any</option>
        {% for a in actions %}
        <option value="{{ a }}" {% if filters.action == a %}selected{% endif %}>{{ a }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="risk_min">Min risk</label>
      <input id="risk_min" name="risk_min" type="number" step="0.05" min="0" max="1"
             value="{{ filters.risk_min if filters.risk_min is not none else '' }}"
             style="width:6rem">
    </div>
    <button type="submit">Filter</button>
  </form>
  {% include "_cases_table.html" %}
</div>
{% endblock %}
