<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EntitlementShield{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e9ef; --muted:#9aa4b2;
            --accent:#5aa2ff; --warn:#c9464b; --ok:#2f9e5f; --hold:#c98a2f; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
    header { display:flex; gap:1.25rem; align-items:center; padding:.75rem 1.25rem;
             border-bottom:1px solid var(--line); background:var(--panel); }
    header .brand { font-weight:700; letter-spacing:.02em; }
    header nav a { color:var(--muted); margin-right:1rem; }
    main { max-width:1040px; margin:0 auto; padding:1.25rem; }
    .banner { background:#3a1d1f; border:1px solid var(--warn); color:#ffd9db;
              padding:.5rem .75rem; border-radius:6px; margin:0 0 1rem; font-size:.85rem; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
             padding:1rem 1.1rem; margin:0 0 1rem; }
    h1 { font-size:1.3rem; margin:.2rem 0 1rem; } h2 { font-size:1rem; margin:0 0 .6rem; }
    table { width:100%; border-collapse:collapse; font-size:.86rem; }
    th, td { text-align:left; padding:.4rem .5rem; border-bottom:1px solid var(--line);
             vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.82rem; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; padding:.05rem .5rem; border-radius:999px; font-size:.75rem;
            border:1px solid var(--line); }
    .s-applied { color:#ffd9db; border-color:var(--hold); } .s-reversed { color:#bfe9cd; }
    .s-proposed { color:var(--muted); } .s-under_review { color:var(--accent); }
    .s-superseded { color:#7a828f; }
    form.filters { display:flex; gap:.6rem; flex-wrap:wrap; align-items:end; margin:0 0 .8rem; }
    label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.15rem; }
    select, input, button { background:#0e1016; color:var(--fg); border:1px solid var(--line);
             border-radius:6px; padding:.35rem .5rem; font:inherit; }
    button { background:var(--accent); color:#08111f; border:none; font-weight:600;
             cursor:pointer; } button:hover { filter:brightness(1.08); }
    .err { background:#3a1d1f; border:1px solid var(--warn); color:#ffd9db;
           padding:.5rem .7rem; border-radius:6px; margin:0 0 1rem; }
    .kv { display:grid; grid-template-columns:auto 1fr; gap:.25rem .9rem; }
    .kv dt { color:var(--muted); } .kv dd { margin:0; }
  </style>
</head>
<body>
  <header>
    <span class="brand">EntitlementShield</span>
    <nav>
      <a href="/cases">Cases</a>
      <a href="/evaluation">Evaluation</a>
    </nav>
  </header>
  <main>
    <p class="banner">DEV TIER — synthetic world. Numbers here are NOT reportable (W-1).</p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
